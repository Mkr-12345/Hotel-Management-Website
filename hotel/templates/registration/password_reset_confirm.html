{% extends "hotel/base.html" %}
{% block content %}<h1 class="page-title">Choose a new password</h1>
<div class="panel narrow">
{% if validlink %}
  <form method="post" class="form" novalidate>{% csrf_token %}
    {% for field in form %}{% include "hotel/includes/field.html" %}{% endfor %}
    <button type="submit" class="btn">Set password</button>
  </form>
{% else %}<p>This reset link is invalid or has expired.</p><a class="btn" href="{% url 'password_reset' %}">Request a new one</a>{% endif %}
</div>{% endblock %}

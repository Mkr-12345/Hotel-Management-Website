<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_help">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="field-error" role="alert">{{ error }}</div>{% endfor %}
</div>
